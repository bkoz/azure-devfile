schemaVersion: 2.2.0
metadata:
  name: azure-cli-workspace
  displayName: Azure CLI Development Environment
  description: Workspace with Azure CLI tools and dependencies
  tags:
    - Azure
    - CLI
    - Cloud
  projectType: azure
  language: bash
  version: 1.0.0

components:
  # Main development container with Azure CLI
  # Note: Build custom image with: docker build -t azure-cli-devfile:latest .
  - name: azure-tools
    container:
      image: azure-cli-devfile:latest
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      cpuLimit: 1000m
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
      endpoints:
        - name: azure-cli
          targetPort: 8080
          protocol: http
          exposure: none
      env:
        - name: AZURE_CONFIG_DIR
          value: /projects/.azure
        - name: SHELL
          value: /bin/bash

commands:
  # Verify Azure CLI installation
  - id: verify-azure-cli
    exec:
      component: azure-tools
      commandLine: |
        echo "Azure CLI Version:"
        az --version
        echo ""
        echo "To login to Azure, run: az login"
      workingDir: /projects
      group:
        kind: run
      label: Verify Azure CLI

  # Login to Azure (interactive)
  - id: azure-login
    exec:
      component: azure-tools
      commandLine: |
        az login
      workingDir: /projects
      group:
        kind: run
      label: Azure Login (Interactive)

  # Login to Azure with device code (better for remote/container environments)
  - id: azure-login-device
    exec:
      component: azure-tools
      commandLine: |
        az login --use-device-code
      workingDir: /projects
      group:
        kind: run
      label: Azure Login (Device Code)

  # Show Azure subscriptions
  - id: azure-list-subscriptions
    exec:
      component: azure-tools
      commandLine: |
        az account list --output table
      workingDir: /projects
      group:
        kind: run
      label: List Azure Subscriptions

  # Azure CLI help
  - id: azure-help
    exec:
      component: azure-tools
      commandLine: |
        az --help
      workingDir: /projects
      group:
        kind: run
      label: Azure CLI Help
